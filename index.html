<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Midnight Manor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1A12; --ink2:#5A3A26; --parch:#F3E6C8; --parch2:#E2CDA0; --pump:#F07A1A; --pump2:#FFB347; --ghost:#9FE8D8;
  --violet:#6E3FB0; --blood:#B3263A; --bg:#0B0816; --iron:#1B1420; --gold:#D9A441; --moss:#4E7A3A;
  --display:"Creepster",cursive; --serif:"IM Fell English",Georgia,serif; --sc:"IM Fell English SC",Georgia,serif; --body:"Lexend",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0B0816; } }
:root[data-theme="dark"]{ --bg:#0B0816; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--parch);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
canvas#world{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}
canvas#fxc{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
#app.shk{animation:shk .45s}
#app.shk2{animation:shk2 .7s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-7px,2px) rotate(-.3deg)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes shk2{0%,100%{transform:none}10%{transform:translate(-14px,6px) rotate(-.6deg)}25%{transform:translate(12px,-8px) rotate(.5deg)}40%{transform:translate(-10px,5px)}55%{transform:translate(8px,-4px)}70%{transform:translate(-5px,2px)}85%{transform:translate(3px,-1px)}}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:max(10px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(14,8,20,.92),rgba(14,8,20,.72));border-bottom:1px solid rgba(240,122,26,.25);box-shadow:0 6px 30px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.crest{font-family:var(--display);font-size:30px;letter-spacing:.04em;color:var(--pump);text-shadow:0 0 14px rgba(240,122,26,.6),0 2px 0 #3A1405;cursor:pointer;user-select:none;line-height:1;white-space:nowrap}
.crest span{display:inline-block;width:.8em;height:.8em;vertical-align:-.05em;margin:0 .02em;background:radial-gradient(circle at 50% 60%,#FFD27A 0 18%,#F07A1A 40%,#B9450B 100%);border-radius:48% 48% 44% 44%;box-shadow:0 0 12px #F07A1A,inset -3px -3px 0 rgba(0,0,0,.25);position:relative}
.crest span::after{content:"";position:absolute;left:44%;top:-18%;width:12%;height:28%;background:#4E7A3A;border-radius:2px}
.trail{display:flex;gap:5px;align-items:center;flex:1;min-width:140px}
.trail i{width:12px;height:12px;border-radius:50%;background:#2A2030;border:1px solid #4A3A50;transition:.4s}
.trail i.puz{border-radius:2px;transform:rotate(45deg) scale(.85)}
.trail i.done{background:var(--pump);border-color:var(--pump2);box-shadow:0 0 10px var(--pump)}
.trail i.now{background:var(--ghost);border-color:#fff;box-shadow:0 0 12px var(--ghost);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px var(--ghost)}}
.candle{display:flex;align-items:center;gap:8px;font-family:var(--sc);font-size:14px;letter-spacing:.12em;color:var(--pump2)}
.candle .tank{width:110px;height:12px;border-radius:7px;background:#1E1622;border:1px solid #4A3A50;overflow:hidden;position:relative}
.candle .lvl{height:100%;background:linear-gradient(90deg,#B9450B,#F07A1A 60%,#FFE3A0);box-shadow:0 0 12px #F07A1A;transition:width 1s}
.candle.low .lvl{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.relics{display:flex;gap:6px}
.relics .rslot{width:40px;height:40px;border-radius:10px;background:#1C1420;border:1px solid #3E3046;display:grid;place-items:center;position:relative}
.relics .rslot svg{width:30px;height:30px}
.relics .rslot.got{border-color:var(--pump);box-shadow:0 0 14px rgba(240,122,26,.55);background:radial-gradient(circle,#3A2414,#1C1420)}
.relics .rslot.land{animation:land .7s cubic-bezier(.2,1.8,.4,1)}
@keyframes land{0%{transform:scale(1.6)}100%{transform:none}}
.relics .rslot b{position:absolute;right:-5px;bottom:-6px;background:var(--pump);color:#1A0C04;font:700 12px var(--body);border-radius:8px;padding:1px 5px}
.clock{font:600 16px var(--body);color:var(--parch2);min-width:52px;text-align:right}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#1E1622;color:var(--parch);border:1px solid #4A3A50;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--pump)}

/* ---------- stage + tablet (aged parchment pinned in an iron frame) ---------- */
main#stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:26px 16px 60px}
.tablet{position:relative;width:min(980px,100%);color:var(--ink);padding:34px 40px 30px;border-radius:6px;
  background:var(--parchtex,linear-gradient(#F3E6C8,#E2CDA0));background-size:cover;
  box-shadow:0 0 0 3px #2A1810,0 0 0 7px #120A10,0 0 0 8px rgba(240,122,26,.45),0 0 60px rgba(240,122,26,.25),0 30px 80px rgba(0,0,0,.7),inset 0 0 60px rgba(90,50,10,.45),inset 0 0 8px rgba(60,30,5,.6);
  animation:rise .7s cubic-bezier(.2,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}}
.tablet.hit{animation:hit .8s}
@keyframes hit{30%{box-shadow:0 0 0 3px #2A1810,0 0 0 7px #120A10,0 0 0 8px #9FE8D8,0 0 90px rgba(159,232,216,.7),0 30px 80px rgba(0,0,0,.7),inset 0 0 60px rgba(90,50,10,.45)}}
.tablet .glint{position:absolute;inset:0;pointer-events:none;border-radius:6px;background:radial-gradient(120% 60% at 50% -10%,rgba(255,220,150,.25),transparent 60%)}
.corner{position:absolute;width:70px;height:70px;pointer-events:none;opacity:.85}
.corner.tl{left:-6px;top:-6px}.corner.tr{right:-6px;top:-6px;transform:scaleX(-1)}
.corner.bl{left:-6px;bottom:-6px;transform:scaleY(-1)}.corner.br{right:-6px;bottom:-6px;transform:scale(-1,-1)}
.eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--sc);font-size:15px;letter-spacing:.12em;color:var(--ink2)}
.eyebrow .tek{background:var(--ink);color:var(--pump2);font:600 12px var(--body);letter-spacing:.06em;padding:3px 9px;border-radius:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,70px);line-height:1;margin:8px 0 10px;color:#2A0E05;letter-spacing:.02em;text-shadow:0 2px 0 rgba(240,122,26,.35)}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,40px);margin:6px 0 8px;color:#2A0E05;line-height:1.05}
h2 .orn{color:var(--pump);margin-left:10px;font-size:.7em;vertical-align:.15em}
.q{font-size:19px;line-height:1.5;margin:10px 0 14px}
.q b{color:#7A2A08}
.lore{font-family:var(--serif);font-size:19px;line-height:1.45;color:#3A2618;max-width:62ch}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font:600 17px var(--body);padding:12px 22px;border-radius:10px;cursor:pointer;border:2px solid #2A1810;background:#3A2A3E;color:var(--parch);box-shadow:0 4px 0 #120A10;transition:transform .12s,filter .2s}
.btn:hover{filter:brightness(1.15)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #120A10}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:linear-gradient(#FFB347,#F07A1A 55%,#C4560E);color:#2A0E05;border-color:#5A2306;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(42,24,16,.5);box-shadow:none}
.fb{min-height:28px;margin-top:10px;font-weight:600;font-size:17px}
.fb.good{color:#2C6A2A} .fb.bad{color:var(--blood)}
.hint{margin-top:10px;padding:12px 16px;border-left:5px solid var(--violet);background:rgba(110,63,176,.12);border-radius:6px;font-size:16px;line-height:1.5}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.levels{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:2px 0 4px;font:600 13px var(--body)}
.levels span{padding:4px 11px;border-radius:12px;background:rgba(42,24,16,.12);color:#6A4A36}
.levels span.now{background:var(--ink);color:var(--pump2)} .levels span.done{background:#2C6A2A;color:#E8FFE0}
.levels b{color:#9A7A60}
.in{font:600 20px var(--body);width:76px;padding:8px;border-radius:8px;border:2px solid #6A4A36;background:#FFF8E6;color:var(--ink);text-align:center}
.in.wide{width:220px}

/* ---------- interactive puzzle widgets ---------- */
.pz{position:relative;margin:6px 0 4px}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:12px;background:rgba(42,24,16,.10);border:2px dashed rgba(42,24,16,.25);min-height:72px}
.tray.lbl::before{content:attr(data-l);position:absolute;transform:translateY(-26px);font:600 12px var(--body);letter-spacing:.1em;color:#6A4A36}
.tile{touch-action:none;user-select:none;cursor:grab;font:700 19px var(--body);color:#2A0E05;padding:10px 14px;border-radius:9px;min-width:58px;text-align:center;position:relative;
  background:linear-gradient(#FFE7A6,#E0AE4C 55%,#A8771F);border:2px solid #5A3A10;box-shadow:0 3px 0 #3A2408,0 6px 12px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px)}
.tile.sel{outline:3px solid var(--violet);outline-offset:3px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.tile.drag{position:fixed;z-index:80;pointer-events:none;transform:scale(1.12) rotate(-3deg);box-shadow:0 18px 30px rgba(0,0,0,.45);margin:0}
.tile.ghost{opacity:.25}
.tile.ok{background:linear-gradient(#DFFFD6,#8FD27E 60%,#4E9A3E);border-color:#2C5A22}
.tile.no{animation:no .5s}
@keyframes no{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.slot{min-width:84px;min-height:52px;border-radius:10px;border:2px dashed rgba(42,24,16,.45);background:rgba(255,248,230,.55);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:5px;transition:.2s}
.slot.over{border-color:var(--pump);background:rgba(240,122,26,.18);box-shadow:0 0 0 4px rgba(240,122,26,.2)}
.slot.full{border-style:solid;border-color:rgba(42,24,16,.25)}
.slot.want{animation:want 1.2s infinite}
@keyframes want{50%{border-color:var(--violet)}}
.plus{font:700 22px var(--body);color:#5A3A26}
/* dials (odometer locks) */
.dials{display:inline-flex;align-items:center;gap:4px;padding:10px 12px;border-radius:12px;background:linear-gradient(#2A2030,#140E18);box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 3px 0 #0A060C;border:2px solid #5A3A26}
.dial{display:flex;flex-direction:column;align-items:center;width:42px}
.dial button{width:40px;height:26px;border:none;border-radius:6px;background:#3A2A3E;color:var(--pump2);cursor:pointer;font-size:13px}
.dial button:hover{background:#4E3A54}
.dial .d{width:40px;height:50px;margin:3px 0;border-radius:6px;display:grid;place-items:center;font:700 30px var(--body);color:#2A0E05;background:linear-gradient(#FFF6DC,#E9D3A2 50%,#C9AE78);box-shadow:inset 0 3px 6px rgba(0,0,0,.35)}
.dials .sep{font:700 30px var(--body);color:var(--pump2);align-self:center;margin:0 1px}
.dials.ok{box-shadow:0 0 0 3px #4E9A3E,0 0 24px rgba(120,220,120,.55)}
.chooser{display:flex;flex-wrap:wrap;gap:10px}
.chooser button{font:600 18px var(--body);padding:12px 18px;border-radius:12px;border:2px solid #5A3A26;background:#FFF4DA;color:var(--ink);cursor:pointer}
.chooser button.on{background:var(--ink);color:var(--pump2);border-color:var(--pump)}
.svgwrap{width:100%;display:flex;justify-content:center}
.svgwrap svg{max-width:100%;height:auto;touch-action:none}
.cap2{font:600 13px var(--body);letter-spacing:.06em;color:#6A4A36;text-transform:uppercase}

/* ---------- title screen ---------- */
.intro{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;align-items:center}
.intro .emblem{width:100%;max-width:330px;justify-self:center;filter:drop-shadow(0 12px 28px rgba(0,0,0,.5))}
.team{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0;font-size:13px;color:#5A3A26}
.mapgrid div{background:rgba(42,24,16,.08);border-radius:8px;padding:8px 10px}
.mapgrid b{display:block;color:#2A0E05;font-size:14px}
details.key{margin-top:8px;font-size:14px;color:#3A2618}
details.key summary{cursor:pointer;font-weight:600}
details.key li{margin:5px 0}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(6,3,10,.72);backdrop-filter:blur(4px);padding:16px;animation:fade .4s}
.overlay.leaving{animation:fadeo 1.2s forwards}
@keyframes fade{from{opacity:0}} @keyframes fadeo{to{opacity:0}}
.reveal{text-align:center;width:min(560px,100%)}
.relicwrap{position:relative;width:180px;height:180px;margin:0 auto}
.relicwrap .relic{position:relative;width:180px;height:180px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(240,122,26,.8))}
.rrays{position:absolute;inset:-60px;background:repeating-conic-gradient(rgba(240,122,26,.28) 0 8deg,transparent 8deg 22deg);border-radius:50%;mask:radial-gradient(circle,#000 20%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes float{50%{transform:translateY(-10px)}}
.gate{position:fixed;inset:0;z-index:70;pointer-events:none}
.gate .l,.gate .r{position:absolute;top:0;bottom:0;width:50.5%;transition:transform 1s cubic-bezier(.7,0,.3,1);
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 96px),linear-gradient(90deg,#3A2014,#5A3220 30%,#4A2818 70%,#2E180E);box-shadow:inset 0 0 80px rgba(0,0,0,.8)}
.gate .l{left:0;transform:translateX(-102%)} .gate .r{right:0;transform:translateX(102%)}
.gate .l::before,.gate .r::before{content:"";position:absolute;left:0;right:0;top:18%;height:26px;background:linear-gradient(#2A2228,#14100F);box-shadow:0 52vh 0 #1E181C,0 3px 6px rgba(0,0,0,.6)}
.gate.shut .l,.gate.shut .r{transform:none}
.gate .seal{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%) scale(0);transition:transform .5s .6s cubic-bezier(.2,1.6,.4,1)}
.gate.shut .seal{transform:translate(-50%,-50%) scale(1)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:65;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(179,38,58,.6))}
#hurt.on{animation:hurt .7s}
@keyframes hurt{20%{opacity:1}}
#ccard{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(6,3,10,.6),rgba(6,3,10,.9));animation:fade .5s}
#ccard.out{animation:fadeo .9s forwards}
.cc-in{text-align:center;padding:16px}
.cc-num{font-family:var(--sc);letter-spacing:.4em;color:var(--pump2);font-size:18px;opacity:0;animation:fade .8s .2s forwards}
.cc-name{font-family:var(--display);font-size:clamp(46px,9vw,104px);color:var(--pump);text-shadow:0 0 30px rgba(240,122,26,.8),0 4px 0 #3A1405;line-height:1.05}
.cc-name span{display:inline-block;opacity:0;animation:drip .7s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes drip{from{opacity:0;transform:translateY(-40px) scaleY(1.4)}to{opacity:1;transform:none}}
.cc-flare{height:2px;width:min(520px,80vw);margin:14px auto;background:linear-gradient(90deg,transparent,var(--pump),transparent)}
.cc-lore{font-family:var(--serif);font-size:21px;color:var(--parch);max-width:44ch;margin:0 auto;opacity:0;animation:fade 1s 1s forwards}
.win .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.win .stats div{background:rgba(42,24,16,.1);border-radius:10px;padding:10px}
.win .stats b{display:block;font:700 30px var(--body);color:#7A2A08}
.win .stats span{font-size:13px;color:#5A3A26}

/* ---------- cinematics ---------- */
#cine{position:fixed;inset:0;z-index:50;background:#000}
#cine canvas{position:absolute;inset:0;width:100%;height:100%}
#cine .cap{position:absolute;left:50%;bottom:max(14px,2.2vh);transform:translateX(-50%);width:min(860px,92vw);text-align:center;font-family:var(--serif);font-size:clamp(19px,2.4vw,28px);color:#F6E9CF;
  text-shadow:0 2px 8px #000,0 0 20px #000;line-height:1.35;transition:opacity .5s;pointer-events:none}
#cine .cap.ghost{font-family:var(--display);color:var(--ghost);font-size:clamp(26px,3.6vw,46px);letter-spacing:.03em;text-shadow:0 0 18px rgba(159,232,216,.8),0 3px 0 #000}
#skip{position:absolute;right:18px;top:16px;z-index:2}
#tpanel{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(6,3,10,.75);padding:16px}
#tpanel .tablet{width:min(640px,100%);max-height:90vh;overflow:auto}
#tpanel .cps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
#tpanel .cps button{text-align:left;padding:10px;border-radius:8px;border:1px solid #6A4A36;background:#FFF6DE;cursor:pointer;font-size:13px;color:#3A2618}
#tpanel .cps b{display:block;font-size:14px;color:#2A0E05}

@media (max-width:720px){
  .tablet{padding:24px 18px 22px}
  .intro{grid-template-columns:1fr}
  .intro .emblem{max-width:200px;grid-row:1}
  .candle .tank{width:60px}
  .crest{font-size:22px}
  .hud{gap:8px 10px;padding:8px 12px}
  .candle span{display:none}
  .relics .rslot{width:34px;height:34px}.relics .rslot svg{width:24px;height:24px}
  .chip{padding:5px 9px;font-size:12px}
  .clock{font-size:14px;min-width:40px}
  .q,.lore{font-size:17px}
  .win .stats{grid-template-columns:1fr 1fr}
  .tile{font-size:16px;padding:8px 10px;min-width:48px}
  .dial{width:34px}.dial .d{width:32px;height:42px;font-size:24px}.dial button{width:32px}
  .dials .sep{font-size:24px}
  #tpanel .cps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
<canvas id="world" aria-hidden="true"></canvas>
<div id="app">
  <header class="hud">
    <div class="crest" title="Midnight Manor">MIDNIGHT MAN<span></span>R</div>
    <div class="trail" id="trail" aria-label="Progress"></div>
    <div class="candle" id="o2" title="Candle light"><span>CANDLE</span><div class="tank"><div class="lvl" id="o2lvl" style="width:100%"></div></div></div>
    <div class="relics" id="relics"></div>
    <div class="clock" id="clock">0:00</div>
    <div class="ctl"><button class="chip" id="mus" type="button">Music: Off</button><button class="chip" id="snd" type="button">Sound FX: Off</button><button class="chip" id="fs" type="button">Full screen</button></div>
  </header>
  <main id="stage"></main>

/* ============================================================
   FX: embers, wisps, spark trails
   ============================================================ */
const FX=(()=>{
  const cv=$("fxc"), c=cv.getContext("2d"); let W,H,D, parts=[], rings=[], fliers=[], last=performance.now();
  function size(){ D=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*D; cv.height=H*D; } size(); addEventListener("resize",size);
  const R=(a,b)=>a+Math.random()*(b-a);
  const center=el=>{ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; };
  function burst(x,y,o={}){ if(RM)return; const n=o.n||46, col=o.col||[240,122,26];
    for(let i=0;i<n;i++){ const a=R(0,Math.PI*2), sp=R(80,o.sp||420), kind=Math.random()<.35?"wisp":"spark";
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-R(0,120),r:kind==="wisp"?R(4,10):R(1.2,3),life:R(.8,1.6),max:1.6,kind,col:Math.random()<.3?[159,232,216]:col}); } }
  function ring(x,y,col=[240,122,26],max=260){ if(RM)return; rings.push({x,y,r:6,max,col,life:1}); }
  function fly(fromEl,toEl,col,done){ if(RM||!fromEl||!toEl){ done&&done(); return; } const [x0,y0]=center(fromEl), [x1,y1]=center(toEl);
    fliers.push({x0,y0,x1,y1,cx:(x0+x1)/2+R(-200,200),cy:Math.min(y0,y1)-R(120,260),t:0,col,done}); }
  let lastE=0;
  addEventListener("pointermove",e=>{ const n=performance.now(); if(RM||n-lastE<60)return; lastE=n; parts.push({x:e.clientX,y:e.clientY,vx:R(-12,12),vy:-R(20,60),r:R(1,2.2),life:R(.5,1),max:1,kind:"spark",col:[255,170,80]}); },{passive:true});
  function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now;
    c.setTransform(D,0,0,D,0,0); c.clearRect(0,0,W,H); c.globalCompositeOperation="lighter";
    rings=rings.filter(r=>{ r.r+=dt*r.max*2.2; r.life-=dt*1.6; c.strokeStyle=rgbStr(r.col,Math.max(0,r.life)*.8); c.lineWidth=3*r.life+1; c.beginPath(); c.arc(r.x,r.y,r.r,0,7); c.stroke(); return r.life>0; });
    parts=parts.filter(p=>{ p.life-=dt; p.vx*=.97; p.vy=p.vy*.97+(p.kind==="wisp"?-50:30)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; const a=Math.max(0,p.life/p.max);
      if(p.kind==="wisp"){ const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2); g.addColorStop(0,rgbStr(p.col,a*.5)); g.addColorStop(1,rgbStr(p.col,0)); c.fillStyle=g; c.beginPath(); c.arc(p.x,p.y,p.r*2,0,7); c.fill(); }
      else { c.fillStyle=rgbStr(p.col,a*.22); c.beginPath(); c.arc(p.x,p.y,p.r*3.2,0,7); c.fill(); c.fillStyle=rgbStr(p.col,a); c.beginPath(); c.arc(p.x,p.y,p.r,0,7); c.fill(); }
      return p.life>0; });
    fliers=fliers.filter(f=>{ f.t+=dt/1.1; const t=Math.min(1,f.t), e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, u=1-e;
      const x=u*u*f.x0+2*u*e*f.cx+e*e*f.x1, y=u*u*f.y0+2*u*e*f.cy+e*e*f.y1;
      for(let i=0;i<3;i++) parts.push({x:x+R(-4,4),y:y+R(-4,4),vx:R(-30,30),vy:R(-30,30),r:R(1.5,3.5),life:R(.4,.8),max:.8,kind:"spark",col:f.col});
      const g=c.createRadialGradient(x,y,0,x,y,26); g.addColorStop(0,"rgba(255,240,210,1)"); g.addColorStop(.3,rgbStr(f.col,.9)); g.addColorStop(1,rgbStr(f.col,0)); c.fillStyle=g; c.fillRect(x-26,y-26,52,52);
      if(t>=1){ burst(f.x1,f.y1,{n:30,sp:220,col:f.col}); ring(f.x1,f.y1,f.col,90); f.done&&f.done(); return false; } return true; });
    requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
  return {burst,ring,fly,center};
})();

(()=>{ const w=900, h=640, c=ART.mk(w,h), x=c.getContext("2d"); const g=x.createRadialGradient(w/2,h*.45,80,w/2,h/2,w*.7); g.addColorStop(0,"#F6EBD0"); g.addColorStop(.7,"#E8D6AE"); g.addColorStop(1,"#C9AE7E"); x.fillStyle=g; x.fillRect(0,0,w,h);

/* ============================================================
   DRAG & DROP (pointer drag, or tap a tile then tap a spot)
   ============================================================ */
function DnD(root,onChange=()=>{}){
  let sel=null, drag=null, locked=false;
  const holders=()=>[...root.querySelectorAll(".slot,.tray")];
  const cap=h=>h.classList.contains("tray")?1e9:+(h.dataset.cap||1);
  const tilesIn=h=>[...h.children].filter(e=>e.classList.contains("tile"));
  function place(tile,h){ if(!h||!tile) return; const from=tile.parentElement; if(h===from){ return; }
    if(tilesIn(h).length>=cap(h)){ const occ=tilesIn(h)[0]; from.appendChild(occ); pop(occ); }
    h.appendChild(tile); pop(tile); sfx.drop(); upd(); onChange(); }
  function pop(t){ t.animate([{transform:"scale(1.25)"},{transform:"none"}],{duration:260,easing:"cubic-bezier(.2,1.6,.4,1)"}); }
  function upd(){ holders().forEach(h=>{ if(h.classList.contains("slot")) h.classList.toggle("full",tilesIn(h).length>=cap(h)); }); }
  function clearSel(){ if(sel){ sel.classList.remove("sel"); sel=null; } root.querySelectorAll(".slot.want").forEach(s=>s.classList.remove("want")); }
  root.addEventListener("pointerdown",e=>{ if(locked) return; const t=e.target.closest(".tile"); if(!t||!root.contains(t)) return; e.preventDefault();
    drag={t,x0:e.clientX,y0:e.clientY,moved:false,id:e.pointerId}; });
  addEventListener("pointermove",e=>{ if(!drag||e.pointerId!==drag.id) return; const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
    if(!drag.moved&&Math.hypot(dx,dy)>7){ drag.moved=true; clearSel(); const r=drag.t.getBoundingClientRect(); drag.ox=drag.x0-r.left; drag.oy=drag.y0-r.top;
      drag.cl=drag.t.cloneNode(true); drag.cl.classList.add("drag"); drag.cl.style.width=r.width+"px"; document.body.appendChild(drag.cl); drag.t.classList.add("ghost"); sfx.pick(); }
    if(drag.moved){ drag.cl.style.left=(e.clientX-drag.ox)+"px"; drag.cl.style.top=(e.clientY-drag.oy)+"px";
      const h=document.elementFromPoint(e.clientX,e.clientY)?.closest(".slot,.tray"); holders().forEach(x=>x.classList.toggle("over",x===h&&root.contains(h))); } });
  addEventListener("pointerup",e=>{ if(!drag||e.pointerId!==drag.id) return; const d=drag; drag=null;
    if(d.moved){ d.cl.remove(); d.t.classList.remove("ghost"); holders().forEach(x=>x.classList.remove("over")); const h=document.elementFromPoint(e.clientX,e.clientY)?.closest(".slot,.tray"); if(h&&root.contains(h)) place(d.t,h); return; }
    // tap
    if(sel===d.t){ clearSel(); return; }
    if(sel&&d.t.parentElement.classList.contains("slot")){ const s=sel; clearSel(); place(s,d.t.parentElement); return; }
    clearSel(); sel=d.t; sel.classList.add("sel"); sfx.pick(); root.querySelectorAll(".slot").forEach(s=>{ if(s!==sel.parentElement) s.classList.add("want"); }); });
  addEventListener("pointercancel",()=>{ if(drag?.cl){ drag.cl.remove(); drag.t.classList.remove("ghost"); } drag=null; });
  root.addEventListener("click",e=>{ if(locked||!sel) return; const h=e.target.closest(".slot,.tray"); if(!h||e.target.closest(".tile")) return; const s=sel; clearSel(); place(s,h); });
  root.addEventListener("keydown",e=>{ if(locked) return; if(e.key!=="Enter"&&e.key!==" ") return; const t=e.target.closest(".tile"), h=e.target.closest(".slot,.tray");
    if(t){ e.preventDefault(); if(sel===t) clearSel(); else if(sel&&t.parentElement.classList.contains("slot")){ const s=sel; clearSel(); place(s,t.parentElement); } else { clearSel(); sel=t; t.classList.add("sel"); } }
    else if(h&&sel){ e.preventDefault(); const s=sel; clearSel(); place(s,h); } });
  upd();
  return { lock(){ locked=true; clearSel(); }, unlock(){ locked=false; }, place, tilesIn, upd };
}
const tile=(v,label,cls="")=>`<button type="button" class="tile ${cls}" data-v="${v}">${label??fmt(v)}</button>`;
const slot=(id,cls="",cap=1,inner="")=>`<div class="slot ${cls}" id="${id}" data-cap="${cap}" tabindex="0" role="button" aria-label="Drop spot">${inner}</div>`;

function dialBind(id){ const el=$(id); if(!el) return; const set=(dd,delta)=>{ if(el.dataset.locked) return; const v=(+dd.textContent+delta+10)%10; dd.textContent=v; dd.setAttribute("aria-valuenow",v); sfx.ratchet();
    dd.animate([{transform:`translateY(${delta>0?10:-10}px)`,opacity:.3},{transform:"none",opacity:1}],{duration:200,easing:"cubic-bezier(.2,1.6,.4,1)"}); };
  el.querySelectorAll(".dial button").forEach(b=>b.onclick=()=>set(b.parentElement.querySelector(".d"),+b.dataset.d));
  el.querySelectorAll(".d").forEach(dd=>{ dd.addEventListener("keydown",e=>{ if(e.key==="ArrowUp"){ e.preventDefault(); set(dd,1);} if(e.key==="ArrowDown"){ e.preventDefault(); set(dd,-1);} if(/^\d$/.test(e.key)){ dd.textContent=e.key; sfx.ratchet(); const nx=dd.parentElement.nextElementSibling; (nx?.querySelector?.(".d")||nx?.nextElementSibling?.querySelector?.(".d"))?.focus(); } });
    dd.addEventListener("wheel",e=>{ e.preventDefault(); set(dd,e.deltaY<0?1:-1); },{passive:false}); }); }
function dialVal(id){ const el=$(id); return [...el.children].map(ch=>ch.classList.contains("sep")?(ch.textContent==="."?".":""):ch.querySelector(".d").textContent).join(""); }
const dialNum=id=>parseFloat(dialVal(id));

function next(){
  S.step++;

  const p=PLAN[S.step]; hud();
  if(p.k==="m"&&p.i%2===0){ WORLD.setTheme(p.ch+1); chamberCard(p.ch); }
  if(p.k==="m"){ p.level=0; runPuzzle(p); } else lockPuzzle(p);
}
const NLEV=3;
function runPuzzle(p){
  const P=PUZ[p.i], c=CHAMBERS[p.ch], first=p.i%2===0; p.level=p.level||0; const L=P.levels[p.level];
  const dots=`<div class="levels" id="levels">${["Level 1","Level 2","Level 3"].map((n,i)=>`<span class="${i<p.level?"done":i===p.level?"now":""}">${i<p.level?"✓ ":""}${n}${i===2?" ★":""}</span>`).join("<b>›</b>")}</div>`;
  stage.innerHTML=frame(`${header(p,"TEK "+P.tek)}
    <h2>${P.title}<span class="orn">✦</span></h2>${dots}
    ${first&&p.level===0?`<p class="lore" style="margin-top:2px">${c.lore}</p>`:""}
    <p class="q">${L.q}</p><div class="pz" id="pz"></div>
    <div class="row" style="margin-top:14px"><button class="btn gold" id="check" type="button">${P.verb||"Check"}</button></div>
    <div class="fb" id="fb" aria-live="polite"></div><div id="hintBox"></div>
    <div class="foot"><button class="btn ghost" id="hintBtn" type="button">Need a hint?</button><button class="btn" id="go" type="button" hidden>Onward</button></div>`);
  const fb=$("fb"); let api=null, over=false;
  const done=()=>{ over=true; api.lock&&api.lock(); sfx.good(); S.o2=Math.min(100,S.o2+6); hud(); glowHit(); const el=$("check"); const [x,y]=FX.center(el); FX.burst(x,y,{n:70}); FX.ring(x,y,[255,170,80]);
    const pills=$("levels").querySelectorAll("span"), cur=pills[p.level]; if(cur){ cur.className="done"; cur.textContent="✓ "+cur.textContent; const [dx,dy]=FX.center(cur); FX.burst(dx,dy,{n:34,sp:190,col:[159,232,216]}); }
    $("check").disabled=true; const g=$("go");
    if(p.level<NLEV-1){ fb.className="fb good"; fb.textContent=p.level===0?"Correct! Level 2 is trickier. Ready?":"Correct! Level 3 is the hardest one. You can do it!";
      g.textContent=`Level ${p.level+2} ➜`; g.hidden=false; g.focus(); g.onclick=()=>{ sfx.click(); p.level++; runPuzzle(p); }; return; }
    fb.className="fb good"; fb.textContent="All 3 levels done! "+P.win; g.hidden=false; g.focus();
    const lastOfRoom=p.i%2===1; g.textContent=lastOfRoom?"Bonus game! ➜":"Onward";
    g.onclick=()=>{ if(g.disabled) return; g.disabled=true; sfx.click(); lastOfRoom?funGame(p.ch,()=>p.ch<4?relicReveal(p):next()):next(); }; };
  const miss=(msg)=>{ S.wrong++; sfx.bad(); shake(); hurt(); const btn=$("check"); fb.className="fb bad"; let t=10; btn.disabled=true; api.wrong&&api.wrong();
    const say=()=>{ fb.textContent=`${msg} The ghost makes you wait ${t} seconds.`; }; say();
    clearInterval(S.cool); S.cool=setInterval(()=>{ t--; if(!document.body.contains(fb)){ clearInterval(S.cool); return; } if(t>0){ sfx.tick(); say(); } else { clearInterval(S.cool); btn.disabled=false; fb.textContent="Try again!"; } },1000); };
  const note=(msg)=>{ fb.className="fb bad"; fb.textContent=msg; };
  api=P.build(L,$("pz"),{p,miss,note,done,fb,level:p.level});
  $("check").onclick=()=>{ if(over||$("check").disabled) return; const r=api.check(); if(!r) return; if(r.empty){ note(r.empty); return; } if(r.ok) done(); else miss(r.msg||"Not yet."); };

}

}

/* 1. Whack-a-Ghost */
function whackGame(root,win){ let hits=0, alive=true, cur=-1, tm=null;
  root.innerHTML=`<div class="score" id="sc">0 / 10 ghosts<small>Tap a ghost when it pops up!</small></div><div class="whack">${Array.from({length:9},(_,i)=>`<button class="grave" type="button" data-i="${i}" aria-label="Grave ${i+1}"><div class="gh">${ICON.ghost}</div></button>`).join("")}</div>`;
  const gr=[...root.querySelectorAll(".grave")];
  const pop=()=>{ if(!alive||!root.isConnected){ return; } gr.forEach(g=>g.classList.remove("up","hit")); let n; do n=Math.floor(Math.random()*9); while(n===cur); cur=n; gr[n].classList.add("up"); if(Math.random()<.5) sfx.moan();
    const stay=Math.max(650,1150-hits*45); tm=setTimeout(()=>{ gr[n].classList.remove("up"); tm=setTimeout(pop,280+Math.random()*350); },stay); };
  gr.forEach((g,i)=>g.onclick=()=>{ if(!alive||!g.classList.contains("up")) return; clearTimeout(tm); g.classList.remove("up"); g.classList.add("hit"); hits++; sfx.whoosh(); const [x,y]=FX.center(g); FX.burst(x,y,{n:30,sp:240,col:[159,232,216]});
    $("sc").innerHTML=`${hits} / 10 ghosts<small>${hits<10?"Keep going!":"Got them all!"}</small>`; if(hits>=10){ alive=false; win(); } else tm=setTimeout(pop,380); });
  setTimeout(pop,700); }

/* 2. Haunted Memory */
function memoryGame(root,win){ const kinds=["ghost","pumpkin","bat","cat","moon","spider"], deck=[...kinds,...kinds].sort(()=>Math.random()-.5); let open=[], busy=false, pairs=0, moves=0;
  root.innerHTML=`<div class="score" id="sc">0 / 6 pairs<small>Moves: 0</small></div><div class="mem">${deck.map((k,i)=>`<button class="card" type="button" data-i="${i}" aria-label="Card ${i+1}"><div class="in"><div class="f"></div><div class="b">${ICON[k]}</div></div></button>`).join("")}</div>`;
  const cards=[...root.querySelectorAll(".card")];
  cards.forEach((c,i)=>c.onclick=()=>{ if(busy||c.classList.contains("flip")||c.classList.contains("done")) return; c.classList.add("flip"); c.setAttribute("aria-label",deck[i]); sfx.page(); open.push(i);

      else { busy=true; $("sc").innerHTML=`${pairs} / 6 pairs<small>Moves: ${moves}</small>`; setTimeout(()=>{ cards[a].classList.remove("flip"); cards[b].classList.remove("flip"); cards[a].setAttribute("aria-label","Card"); cards[b].setAttribute("aria-label","Card"); busy=false; },900); } } }); }

/* 3. Potion Echo (repeat the glowing pattern) */
function simonGame(root,win){ const cols=["#6ACF5A","#C47AF0","#F0B04A","#5AB0F0"], notes=[293.7,349.2,440,587.3]; let round=0, seq=[], pos=0, listening=false; const lens=[3,4,5];
  root.innerHTML=`<div class="score" id="sc">Round 1 of 3<small>Watch the bottles...</small></div><div class="simon">${cols.map((c,i)=>`<button type="button" data-i="${i}" style="--c:${c}" aria-label="Bottle ${i+1}" disabled><svg viewBox="0 0 96 132"><path d="M36 6 H60 V30 Q86 44 86 78 Q86 124 48 124 Q10 124 10 78 Q10 44 36 30Z" fill="${c}" stroke="#2A1A10" stroke-width="4"/><rect x="34" y="0" width="28" height="14" rx="3" fill="#7A4A2A"/><path d="M22 54 Q30 46 34 56" stroke="#fff" stroke-opacity=".55" stroke-width="5" fill="none"/></svg></button>`).join("")}</div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" id="again" type="button">Show me again</button></div>`;
  const bs=[...root.querySelectorAll(".simon button")];
  const flash=(i,ms=420)=>{ bs[i].classList.add("lit"); if(S.sound&&AC) mbox(notes[i],{vol:.08,dur:1.2}); setTimeout(()=>bs[i].classList.remove("lit"),ms); };
  const play=()=>{ listening=false; pos=0; bs.forEach(b=>b.disabled=true); $("sc").innerHTML=`Round ${round+1} of 3<small>Watch the bottles...</small>`;
    seq.forEach((n,k)=>setTimeout(()=>{ if(root.isConnected) flash(n); },700+k*650));
    setTimeout(()=>{ if(!root.isConnected) return; listening=true; bs.forEach(b=>b.disabled=false); $("sc").innerHTML=`Round ${round+1} of 3<small>Your turn! Tap the bottles in the same order.</small>`; },700+seq.length*650); };
  const newRound=()=>{ seq=Array.from({length:lens[round]},(_,k)=>{ let n; do n=Math.floor(Math.random()*4); while(k>0&&n===seq[k-1]); seq[k]=n; return n; }); play(); };
  bs.forEach((b,i)=>b.onclick=()=>{ if(!listening) return; flash(i,250);
    if(i!==seq[pos]){ listening=false; sfx.bad(); $("sc").innerHTML=`Round ${round+1} of 3<small>Oops! Watch again...</small>`; setTimeout(play,900); return; }
    pos++; if(pos===seq.length){ listening=false; sfx.bubble(5); round++; if(round===3){ $("sc").innerHTML=`3 of 3 rounds<small>Perfect potion!</small>`; win(); } else { $("sc").innerHTML=`Round ${round} done!<small>Get ready...</small>`; setTimeout(newRound,1100); } } });
  $("again").onclick=()=>{ if(listening||pos===0) play(); };
  setTimeout(newRound,500); }

/* 4. Where's the Ghost? (shell game) */
function hatsGame(root,win){ let wins=0, slots=[0,1,2], ghostHat=0, phase="show";
  root.innerHTML=`<div class="score" id="sc">0 / 3 found<small>Watch which hat the ghost hides under!</small></div><div class="hats" id="hats">${[0,1,2].map(i=>`<button class="hat" type="button" data-h="${i}" aria-label="Hat"><div class="gh">${ICON.ghost}</div><div class="top">${ICON.hat}</div></button>`).join("")}</div>`;
  const hats=[...root.querySelectorAll(".hat")];
  const place=()=>hats.forEach((h,i)=>h.style.left=(slots[i]*35)+"%");
  const round=()=>{ phase="show"; ghostHat=Math.floor(Math.random()*3); hats.forEach((h,i)=>{ h.querySelector(".gh").classList.toggle("show",i===ghostHat); h.classList.add("lift"); }); place(); sfx.moan();
    $("sc").innerHTML=`${wins} / 3 found<small>Watch which hat the ghost hides under!</small>`;
    setTimeout(()=>{ hats.forEach(h=>h.classList.remove("lift")); },1400);
    const swaps=5+wins*3, speed=Math.max(240,460-wins*90); hats.forEach(h=>h.style.transitionDuration=(speed*.85)+"ms");
    for(let k=0;k<swaps;k++) setTimeout(()=>{ if(!root.isConnected) return; const a=Math.floor(Math.random()*3); let b; do b=Math.floor(Math.random()*3); while(b===a); [slots[a],slots[b]]=[slots[b],slots[a]]; place(); sfx.whoosh(); },1900+k*speed);
    setTimeout(()=>{ phase="pick"; $("sc").innerHTML=`${wins} / 3 found<small>Which hat is the ghost under? Tap it!</small>`; },1900+swaps*speed+200); };
  hats.forEach((h,i)=>h.onclick=()=>{ if(phase!=="pick") return; phase="wait"; hats.forEach(x=>x.querySelector(".gh").classList.toggle("show",hats.indexOf(x)===ghostHat)); h.classList.add("lift");
    if(i===ghostHat){ wins++; sfx.laugh(); $("sc").innerHTML=`${wins} / 3 found<small>Found it!</small>`; if(wins>=3){ win(); return; } }
    else { setTimeout(()=>hats[ghostHat].classList.add("lift"),400); sfx.bad(); $("sc").innerHTML=`${wins} / 3 found<small>Not that one! Try again.</small>`; }
    setTimeout(round,2000); });
  place(); setTimeout(round,600); }

/* 5. The Candle Maze */
function mazeGame(root,win){ const N=9, r=ART.rng(Math.floor(Math.random()*999)+1), walls=[]; // walls[y][x] = {r,b}
  for(let y=0;y<N;y++){ walls.push([]); for(let x=0;x<N;x++) walls[y].push({r:true,b:true}); }
  const seen=new Set(["0,0"]), stack=[[0,0]];
  while(stack.length){ const [x,y]=stack[stack.length-1], nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N&&!seen.has(a+","+b));
    if(!nb.length){ stack.pop(); continue; } const [nx,ny]=nb[Math.floor(r()*nb.length)];
    if(nx>x) walls[y][x].r=false; if(nx<x) walls[y][nx].r=false; if(ny>y) walls[y][x].b=false; if(ny<y) walls[ny][x].b=false; seen.add(nx+","+ny); stack.push([nx,ny]); }
  let px=0, py=0, done=false; const C=48, P=12, Wd=N*C+P*2; S.mazeDbg={walls,N};
  root.innerHTML=`<div class="score" id="sc">Reach the door!<small>Arrow keys, arrow buttons, or swipe</small></div><canvas class="maze" id="mz" width="${Wd*2}" height="${Wd*2}" tabindex="0" aria-label="Maze"></canvas>
    <div class="pad"><span></span><button type="button" data-d="0,-1" aria-label="Up">▲</button><span></span><button type="button" data-d="-1,0" aria-label="Left">◀</button><button type="button" data-d="0,1" aria-label="Down">▼</button><button type="button" data-d="1,0" aria-label="Right">▶</button></div>`;
  const cv=$("mz"), c=cv.getContext("2d"); c.scale(2,2); let t0=performance.now(), trail=[[0,0]];
  const draw=()=>{ if(!cv.isConnected) return; const t=(performance.now()-t0)/1000; c.fillStyle="#140E18"; c.fillRect(0,0,Wd,Wd);
    // the candle lights the maze around it
    const lx=P+px*C+C/2, ly=P+py*C+C/2, g=c.createRadialGradient(lx,ly,10,lx,ly,170); g.addColorStop(0,"rgba(255,180,90,.35)"); g.addColorStop(1,"rgba(255,180,90,0)"); c.fillStyle=g; c.fillRect(0,0,Wd,Wd);
    c.fillStyle="rgba(255,180,90,.12)"; trail.forEach(([x,y])=>c.fillRect(P+x*C+C/2-5,P+y*C+C/2-5,10,10));
    c.strokeStyle="#B79AF0"; c.lineWidth=4; c.lineCap="round"; c.beginPath(); c.rect(P,P,N*C,N*C);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const X=P+x*C, Y=P+y*C; if(walls[y][x].r&&x<N-1){ c.moveTo(X+C,Y); c.lineTo(X+C,Y+C); } if(walls[y][x].b&&y<N-1){ c.moveTo(X,Y+C); c.lineTo(X+C,Y+C); } } c.stroke();
    // the Midnight Door
    const dx=P+(N-1)*C, dy=P+(N-1)*C; c.fillStyle="#5A3220"; c.beginPath(); c.moveTo(dx+10,dy+C-6); c.lineTo(dx+10,dy+18); c.quadraticCurveTo(dx+C/2,dy+2,dx+C-10,dy+18); c.lineTo(dx+C-10,dy+C-6); c.fill(); c.fillStyle="#FFE27A"; c.beginPath(); c.arc(dx+C-16,dy+C/2+4,2.5,0,7); c.fill();
    // candle
    c.fillStyle="#E8DCC0"; c.fillRect(lx-5,ly-4,10,16); const f=1+.15*Math.sin(t*14); c.fillStyle="#FFB347"; c.beginPath(); c.moveTo(lx-5,ly-4); c.quadraticCurveTo(lx,ly-22*f,lx+5,ly-4); c.fill(); c.fillStyle="#FFF4C8"; c.beginPath(); c.ellipse(lx,ly-8,2,4*f,0,0,7); c.fill();
    requestAnimationFrame(draw); };
  draw();
  const move=(dx,dy)=>{ if(done) return; let ok=false; if(dx===1) ok=px<N-1&&!walls[py][px].r; if(dx===-1) ok=px>0&&!walls[py][px-1].r; if(dy===1) ok=py<N-1&&!walls[py][px].b; if(dy===-1) ok=py>0&&!walls[py-1][px].b;
    if(!ok){ sfx.tick(); return; } px+=dx; py+=dy; trail.push([px,py]); sfx.click(); if(px===N-1&&py===N-1){ done=true; sfx.door(); win(); } };
  root.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{ const [x,y]=b.dataset.d.split(",").map(Number); move(x,y); });
  const key=e=>{ if(!cv.isConnected){ removeEventListener("keydown",key); return; } const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key]; if(m&&!e.target.closest?.("input")){ e.preventDefault(); move(...m); } };
  addEventListener("keydown",key);
  let sw=null; cv.addEventListener("pointerdown",e=>{ sw=[e.clientX,e.clientY]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove",e=>{ if(!sw) return; const dx=e.clientX-sw[0], dy=e.clientY-sw[1]; const step=Math.max(18,cv.getBoundingClientRect().width/N*.6);
    if(Math.abs(dx)>step||Math.abs(dy)>step){ if(Math.abs(dx)>Math.abs(dy)) move(Math.sign(dx),0); else move(0,Math.sign(dy)); sw=[e.clientX,e.clientY]; } });
  cv.addEventListener("pointerup",()=>sw=null); cv.focus({preventScroll:true}); }

        if(t>5){ c.save(); c.strokeStyle="rgba(190,200,240,.35)"; c.lineWidth=1.3; for(let i=0;i<140;i++){ const yy=((i*.137+t*1.4)%1)*960-40, xx=((i*.611)%1)*1700-50+yy*.15; c.beginPath(); c.moveTo(xx,yy); c.lineTo(xx-5,yy+26); c.stroke(); } c.restore(); }
        if(LIVE.flash>0){ c.save(); c.globalCompositeOperation="lighter"; c.fillStyle=`rgba(170,180,255,${LIVE.flash*.4})`; c.fillRect(0,0,1600,900); c.restore(); }
      } else if(t<17){ // ---- the manor on the hill ----

        kids.forEach((K,i)=>{ const tt=t-9-i*.25; K.f=1; K.x=lerpC(-60,780+i*8,ease(tt/6.5)); K.y=lerpC(800,775,ease(tt/6.5))-Math.max(0,tt-6)*30; K.s=lerpC(.5,.32,ease(tt/7)); K.ph+=dt*11; K.pose=KID.run(K.ph,.9);
          if(tt>0) KID.full(c,K,dt,t,{sil:"#050408",far:"#100C16"}); });

/* ============================================================

    [[.6,()=>{ sfx.page(); sfx.magic(); }],[3.6,X=>{ sfx.slam(); X.shake=.8; }],[4.3,()=>sfx.fall()],[7,()=>WORLD.setTheme(3)],[7.4,X=>{ sfx.thud(); X.shake=.7; }],[7.6,()=>sfx.thud()],[7.8,()=>sfx.thud()],[8.4,()=>sfx.bubble(6)]],
    [[.6,()=>{ sfx.pour(); sfx.magic(); }],[2.6,()=>sfx.magic()],[4.4,()=>{ choir([293.7,370,440,587],0,4,.04); }],[7,()=>WORLD.setTheme(4)],[8,()=>sfx.moan()]],
    [[.6,()=>{ sfx.match(); sfx.magic(); }],[3.4,()=>sfx.creak(1.2)],[5,()=>sfx.creak(1.2)],[7.2,()=>WORLD.setTheme(5)],[7.8,()=>{ sfx.bell(1,1,110); }],[9,()=>sfx.gears()]],

  playCine({label:"Story: the team follows the relic's magic to the next room",dur:D,caps,events:evs,done:()=>{ musicMood(null); done(); },
    draw(X,t,dt){ const c=X.c; LIVE.tick(dt,{noGhosts:true,noStorm:true}); const before=t<cut, room=before?fromRoom:toRoom, lt=before?t:t-cut;
      if(before){ X.CAM.x=800; X.CAM.y=lerpC(450,430,ease(t/cut)); X.CAM.z=lerpC(1,1.12,ease(t/cut)); }
      else { const k=ease((lt-3.4)/2.6), tgt=[[ART.BX0+200,ART.BY0+250,1.9],[ART.BX0+150,ART.BY0+260,1.8],[800,700,1.5],[800,ART.BY0+230,1.7]][n]; X.CAM.x=lerpC(800,tgt[0],k); X.CAM.y=lerpC(450,tgt[1],k); X.CAM.z=lerpC(1,tgt[2],k); }
      LIVE.room(c,room,t+n*10,{still:1,noGears:false});
      const rim={rim:"rgba(255,170,90,.38)"};
      if(n===0){ // key -> secret passage in the back wall
        if(before){ const open=seg(t,3.6,5.2), dx=ART.BX0+470, w=150*open;
          if(open>0){ c.fillStyle="#020104"; c.beginPath(); ART.archPath(c,dx-w/2,ART.BY0+230,w,270); c.fill(); LIVE.glow(c,dx,ART.BY0+400,160*open,"159,232,216",.25*open);
            for(let i=0;i<10;i++){ const p=((t*.6+i*.13)%1); c.fillStyle=`rgba(200,190,170,${.3*(1-p)})`; c.beginPath(); c.arc(dx+(i-5)*16,ART.BY0+500-p*120,3+p*6,0,7); c.fill(); } }
          const kx=lerpC(800,dx,ease((t-.6)/2.8)), ky=lerpC(560,ART.BY0+380,ease((t-.6)/2.8))+Math.sin(t*3)*10; if(t<3.8) relicGlow(c,kx,ky,.9,relic,t);
          kids.forEach((K,i)=>{ const wk=ease((t-5.2-i*.12)/1.9); const u=lerpC(.32+i*.07,.5,wk), z=lerpC(1.6+(i%2)*.15,1.02,wk); atDepth(K,u,z); K.f=u<.5?1:-1; if(t>5.2){ K.ph+=dt*8; K.pose=KID.walk(K.ph); } else K.pose=KID.stand(t,i,6); });
          kids.slice().sort((a,b)=>a.y-b.y).forEach(K=>{ if(K.s>.47){ shadow(c,K); KID.full(c,K,dt,t,rim); } }); }
        else { kids.forEach((K,i)=>{ const wk=ease((lt-i*.12)/2.2); atDepth(K,lerpC(.5,.3+i*.08,wk),lerpC(1.05,1.6+(i%2)*.15,wk)); K.f=1; if(lt<2.4){ K.ph+=dt*8; K.pose=KID.walk(K.ph); } else K.pose=KID.stand(t,i,14); });
          kids.slice().sort((a,b)=>a.y-b.y).forEach(K=>{ shadow(c,K); KID.full(c,K,dt,t,rim); }); } }
      if(n===1){ // spell book -> trapdoor -> fall into the kitchen
        if(before){ const bx=800, by=lerpC(640,520,ease(t/1.5)); LIVE.glow(c,bx,by,180,"160,120,255",.35+.1*Math.sin(t*5)); LIVE.book(c,bx,by,1.6,Math.sin(t*2)*.1,.6+.4*Math.sin(t*4),"#4A1A6A");
          for(let i=0;i<12;i++){ const a=t*2+i*.52, r=60+i*6; c.fillStyle=`rgba(200,170,255,${.5-i*.03})`; c.beginPath(); c.arc(bx+Math.cos(a)*r,by+Math.sin(a)*r*.5,3,0,7); c.fill(); }
          const hole=seg(t,3.4,3.8); if(hole>0){ c.fillStyle="#000"; c.beginPath(); c.ellipse(800,ART.floorY(1.6),420*hole,70*hole,0,0,7); c.fill(); }
          kids.forEach((K,i)=>{ atDepth(K,.3+i*.08,1.55+(i%2)*.12); K.f=i<3?1:-1; if(t<3.6) K.pose=KID.mix(KID.stand(t,i,10),KID.scared(t,i),seg(t,2.6,3.4)); else { K.pose=KID.flail(t,i); K.y+=Math.pow(Math.max(0,t-3.6-i*.06),2)*900; } });

        else { kids.forEach((K,i)=>{ const land=.4+i*.18, fall=lt<land; atDepth(K,.28+i*.09,1.5+(i%3)*.12); K.f=i%2?1:-1;
            if(fall){ K.y-=Math.pow(land-lt,2)*2200; K.pose=KID.flail(t,i); } else if(lt<land+1.6){ K.pose=KID.mix(KID.sprawl(t,i),KID.crouch(),seg(lt,land+.6,land+1.6)); K.rot=0; } else K.pose=KID.mix(KID.crouch(),KID.stand(t,i,10),seg(lt,land+1.6,land+2.4)); });
          kids.slice().sort((a,b)=>a.y-b.y).forEach(K=>{ shadow(c,K); KID.full(c,K,dt,t,rim); });
          c.save(); c.fillStyle="rgba(200,190,170,.25)"; for(let i=0;i<20;i++){ const p=seg(lt,.5,2.5); if(p>0&&p<1){ c.beginPath(); c.arc(500+i*30,ART.floorY(1.6)-p*80*(1+i%3),6+p*20,0,7); c.fill(); } } c.restore(); } }
      if(n===2){ // potion mist -> float up -> float down into the ballroom
        if(before){ const m=seg(t,.4,3); for(let i=0;i<5;i++){ c.save(); c.globalAlpha=.35*m; c.filter="hue-rotate(60deg)"; c.drawImage(LIVE.fog(),300+i*180+Math.sin(t+i)*60,ART.floorY(1.5)-120-i*10-t*12,400,140); c.restore(); }
          LIVE.glow(c,800,600,400*m,"170,120,255",.25*m); relicGlow(c,800,lerpC(700,560,ease(t/1.5)),.8,relic,t);
          kids.forEach((K,i)=>{ atDepth(K,.28+i*.09,1.55+(i%2)*.12); K.f=i%2?1:-1; const up=Math.max(0,t-4.4-i*.15); K.y-=Math.pow(up,1.6)*160; K.pose=up>0?KID.float(t,i):KID.mix(KID.stand(t,i,10),KID.wave(t,i),seg(t,3,4)); K.rot=up>0?Math.sin(t*1.4+i)*12:0; });
          kids.slice().sort((a,b)=>a.y-b.y).forEach(K=>{ KID.full(c,K,dt,t,{...rim,grav:300}); }); }
        else { kids.forEach((K,i)=>{ atDepth(K,.28+i*.09,1.5+(i%2)*.12); K.f=i%2?1:-1; const d=Math.max(0,3.2-lt+i*.12); K.y-=d*d*90; K.rot=d>0?Math.sin(t*1.4+i)*10:0; K.pose=d>0?KID.float(t,i):KID.stand(t,i,16); });
          kids.slice().sort((a,b)=>a.y-b.y).forEach(K=>{ shadow(c,K); KID.full(c,K,dt,t,{rim:"rgba(170,190,255,.4)",grav:300}); }); } }

          kids.forEach((K,i)=>{ const wk=ease((t-2.4-i*.14)/3.4); atDepth(K,lerpC(.3+i*.08,.5,wk),lerpC(1.6+(i%2)*.15,1.03,wk)); K.f=K.x<cx?1:-1; if(t>2.4){ K.ph+=dt*8; K.pose=KID.walk(K.ph); } else K.pose=KID.stand(t,i,12); });

/* ============================================================
   ESCAPE: the clock strikes twelve, the Midnight Door opens, run!
   ============================================================ */
function escapeCinematic(done){
  const kids=KID.make(), D=26, doorU=.59, doorX=ART.wallX(doorU,false);
  let strikes=0;
  const ev=[[.2,()=>{ musicMood(MOODS.silence); S.midnight=2; }]];
  for(let i=0;i<12;i++) ev.push([.6+i*.62,X=>{ toll(98,{vol:.2,dur:5}); strikes=i+1; X.shake=.25; }]);
  ev.push([8.3,X=>{ sfx.door(); X.shake=.8; musicMood(MOODS.aftermath); }],[9.8,()=>sfx.whoosh()],[12.4,()=>{ sfx.choir(); }],[14,()=>sfx.laugh()],[16,()=>LIVE.batFlock(10,{dir:1,y:200})],[18.5,()=>sfx.win()]);
  const caps=[[.6,4,"BONG... BONG... The clock strikes twelve!"],[4.2,8,"The relics glow. The Midnight Door rumbles..."],[8.4,12,"The door swings open! RUN!"],
    [12.6,16.4,"You burst out into the cool night air."],[16.6,21,"The ghosts wave goodbye from the windows..."],[21.2,25.6,"You escaped Midnight Manor! Happy Halloween!"]];
  playCine({label:"Ending: the team escapes the manor at midnight",dur:D,events:ev,caps,done,
    draw(X,t,dt){ const c=X.c; LIVE.tick(dt,{noGhosts:true,noStorm:true});
      if(t<12.4){ const k=ease(t/8); X.CAM.x=lerpC(800,980,k); X.CAM.y=lerpC(450,430,k); X.CAM.z=lerpC(1.15,1.05,k);
        LIVE.room(c,5,t,{still:1});
        // relic symbols on the door light up one by one, then light pours out
        const dy=ART.wallTop(doorX)+(ART.wallBot(doorX)-ART.wallTop(doorX))*.5;
        ["candle","key","potion","book"].forEach((r,i)=>{ if(t>4.4+i*.7) LIVE.glow(c,doorX-30+i*20,dy-60,60,"255,170,60",.6); });
        const op=seg(t,8.3,10); if(op>0){ c.save(); c.globalCompositeOperation="lighter"; const g=c.createRadialGradient(doorX,dy,10,doorX,dy,900*op); g.addColorStop(0,`rgba(230,235,255,${.9*op})`); g.addColorStop(.3,`rgba(170,180,255,${.4*op})`); g.addColorStop(1,"rgba(150,160,255,0)"); c.fillStyle=g; c.fillRect(0,0,1600,900); c.restore(); }
        kids.forEach((K,i)=>{ const go=Math.max(0,t-8.8-i*.2), k2=ease(go/2.4); atDepth(K,lerpC(.25+i*.07,.98,k2),lerpC(1.6+(i%2)*.14,1.25,k2)); K.f=go>0?1:(i%2?1:-1);
          if(go>0){ K.ph+=dt*12; K.pose=KID.run(K.ph); } else K.pose=t>4?KID.mix(KID.stand(t,i,20),KID.wave(t,i),.3):KID.stand(t,i,26); });
        kids.slice().sort((a,b)=>a.y-b.y).forEach(K=>{ if(K.x<doorX+20){ shadow(c,K); KID.full(c,K,dt,t,{rim:t>8.3?"rgba(220,230,255,.6)":"rgba(255,170,90,.35)",rx:2}); } });
        const wf=seg(t,11.4,12.4); if(wf>0){ c.save(); c.setTransform(1,0,0,1,0,0); c.fillStyle=`rgba(230,235,255,${wf})`; c.fillRect(0,0,99999,99999); c.restore(); X.view(); } }
      else { const lt=t-12.4, k=ease(lt/10); X.CAM.x=800; X.CAM.y=lerpC(470,420,k); X.CAM.z=lerpC(1.25,1,k);
        LIVE.exterior(c,t,{still:1,clear:ease(lt/6)});
        LIVE.glow(c,800,445,180,"255,200,130",.5);
        // ghosts waving from the windows
        if(lt>3.6) ART.ext().wins.slice(0,6).forEach(([x,y],i)=>{ const a=ease((lt-3.6-i*.2)/1); LIVE.ghost(c,x,y+6,.28,t+i,.75*a,i%2?1:-1,{arms:1}); });
        kids.forEach((K,i)=>{ const go=Math.max(0,lt-.2-i*.22), k2=ease(go/4.2); K.f=i%2?1:-1; K.x=lerpC(800,250+i*220,k2); K.y=lerpC(470,765+(i%2)*22,k2); K.s=lerpC(.2,.82,k2);
          if(go<4.4){ K.f=K.x<800?-1:1; K.ph+=dt*11; K.pose=KID.run(K.ph); } else { K.f=1; K.pose=lt>9?KID.cheer(t,i):KID.wave(t,i); } });
        kids.slice().sort((a,b)=>a.y-b.y).forEach(K=>{ if(K.s>.21) KID.full(c,K,dt,t,{sil:"#060409",far:"#140E1A",rim:"rgba(200,210,255,.35)"}); });
        const wf=1-seg(lt,0,.9); if(wf>0){ c.save(); c.setTransform(1,0,0,1,0,0); c.fillStyle=`rgba(230,235,255,${wf})`; c.fillRect(0,0,99999,99999); c.restore(); X.view(); } } } });
}
